name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-version --strict

      - name: PHP Syntax Check (Lint)
        run: find . -type f -name "*.php" -not -path "./tests/tmp/*" -not -path "./scratch/*" -exec php -l {} +

      - name: Run CI-Safe Automated Tests
        run: php tests/ci_runner.php