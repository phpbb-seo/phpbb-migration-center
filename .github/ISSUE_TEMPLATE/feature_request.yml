name: Feature Request / Connector Suggestion
description: Suggest an idea, enhancement, or new platform connector for phpBB Migration Center
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or want to request support for an additional source forum platform? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the limitation or challenge is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you have considered.

  - type: input
    id: source_platform
    attributes:
      label: Applicable Platform Connector (if relevant)
      placeholder: "e.g. vBulletin 4.x, MyBB 1.8, SMF 2.1, Invision Community 4.x"